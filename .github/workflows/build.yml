name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./internal/...
      - run: go test ./internal/...
      - run: node --check internal/web/page.js

  build:
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Debian 12 matches the CPA Docker image, so the plugin links against the same glibc.
    container: golang:1.26-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV" ;;
            *) echo "VERSION=0.0.0-dev.${GITHUB_SHA%"${GITHUB_SHA#???????}"}" >> "$GITHUB_ENV" ;;
          esac
      - name: Build
        run: |
          go build -buildvcs=false -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o "dist/lamplighter-v$VERSION.so" .
          rm -f dist/*.h
      - name: Package
        run: |
          apt-get update -qq && apt-get install -y -qq zip > /dev/null
          cd dist
          zip -q "lamplighter_${VERSION}_linux_${{ matrix.arch }}.zip" "lamplighter-v$VERSION.so"
          sha256sum "lamplighter_${VERSION}_linux_${{ matrix.arch }}.zip" > "lamplighter_${VERSION}_linux_${{ matrix.arch }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: lamplighter-linux-${{ matrix.arch }}
          path: dist/*.zip*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes *.zip SHA256SUMS
